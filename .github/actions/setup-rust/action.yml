name: "Setup Rust"
description: "Install Rust toolchain pinned by rust-toolchain.toml, with cargo-llvm-cov and cargo cache"
inputs:
  rust-version:
    description: "Rust toolchain"
    required: false
    default: "stable"
runs:
  using: "composite"
  steps:
    - name: Setup Rust toolchain (rust-toolchain.toml takes precedence)
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy,rustfmt,llvm-tools-preview
        cache: false
        # This action defaults RUSTFLAGS to "-D warnings" job-wide, which would turn benign
        # warnings (e.g. unused imports in openapi-generated crud-contracts) into hard errors under
        # each crate's declared MSRV in compat:min-version. Clear it to match the prior baseline;
        # the clippy targets still pass their own explicit `-- -D warnings`.
        rustflags: ""

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          apps/crud-be-rust-axum/target
          apps/rhino-cli/target
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Install cargo-hack
      uses: taiki-e/install-action@cargo-hack

    # The root rust-toolchain.toml pins the default toolchain (kept in lockstep with
    # apps/rhino-cli/rust-toolchain.toml), so clippy/fmt run on the pinned channel even when invoked
    # with `--manifest-path` from the workspace root. Each `cargo hack check --rust-version` (run in
    # parallel across projects by `nx run-many`/`nx affected`) still races rustup to install the
    # same missing MSRV toolchain concurrently, corrupting the shared download dir
    # ("could not rename downloaded file ... No such file or directory"). Pre-install each pinned
    # rust-version sequentially so the parallel compat:min-version tasks only ever read a toolchain
    # that is already present.
    #
    # Both name forms are installed on purpose: cargo-hack resolves a `rust-version = "X.Y.Z"` floor
    # to the toolchain name `X.Y` (`rustup toolchain add X.Y`), and rustup stores `X.Y` under a
    # different directory from `X.Y.Z`. Installing only the declared patch-level string therefore
    # leaves the `X.Y` download to race exactly as before.
    #
    # Extraction uses `sed` rather than `grep -P`: BSD grep (macOS) has no `-P`, and a silent
    # extraction failure there installs nothing at all while still exiting 0.
    - name: Pre-install pinned MSRV toolchain(s) (avoids rustup download race under parallel cargo-hack)
      shell: bash
      run: |
        floors=$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
          apps/*/Cargo.toml 2>/dev/null | sort -u)
        for v in $floors; do
          rustup toolchain install "$v" --profile minimal
          mm=$(printf '%s\n' "$v" | cut -d. -f1,2)
          if [ "$mm" != "$v" ]; then
            rustup toolchain install "$mm" --profile minimal
          fi
        done
